name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The core install is deliberately light: chunking, metrics and the
      # statistics layer run without torch, a GPU, or any backing service.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check backend tests

      - name: Test
        run: pytest -q

      - name: Verify similarity metrics are rank-equivalent
        run: |
          python -m geolytics.cli check-metrics --n-passages 200
        env:
          PYTHONPATH: backend
