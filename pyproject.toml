[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geolytics"
version = "0.1.0"
description = "Automated Generative Engine Optimization (GEO) and RAG Auditing System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Kept deliberately light: the chunking, metrics and statistics layers -- the
# parts the evaluation chapter depends on -- must be runnable (and testable)
# without a GPU, a model download, or any running service.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
crawl = ["playwright>=1.42", "beautifulsoup4>=4.12", "lxml>=5.1", "trafilatura>=1.8"]
vector = ["qdrant-client>=1.12"]
embed = ["sentence-transformers>=2.6"]
lexical = ["rank-bm25>=0.2.2"]
queue = ["arq>=0.25", "redis>=5.0"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3", "mypy>=1.9"]
all = ["geolytics[crawl,vector,embed,lexical,queue,postgres,dev]"]

[project.scripts]
geolytics = "geolytics.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["geolytics"]
mypy_path = "backend"
ignore_missing_imports = true
